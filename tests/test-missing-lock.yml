name: Test missing poetry.lock fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure no lock file exists
        run: |
          if [ -f tests/fixtures/no-lock-project/poetry.lock ]; then
            echo "FAIL: fixture unexpectedly has a lock file"
            exit 1
          fi
      - id: action
        uses: .
        continue-on-error: true
        with:
          working-directory: tests/fixtures/no-lock-project
          python-version: "3.10"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when poetry.lock is missing"
            exit 1
          fi
          echo "PASS"
