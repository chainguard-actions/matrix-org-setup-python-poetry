name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure user scripts dir is on PATH (as on hosted runners)
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          working-directory: tests/fixtures/simple-project
          python-version: "3.10"
      - name: Assert poetry installed and project importable
        working-directory: tests/fixtures/simple-project
        run: |
          poetry --version
          poetry --version | grep -q "1.2.2" || { echo "FAIL: expected poetry 1.2.2"; exit 1; }
          if ! poetry run pip show demo-project; then
            echo "FAIL: project not installed in venv"
            exit 1
          fi
          VAL="$(cd /tmp && cd "$GITHUB_WORKSPACE/tests/fixtures/simple-project" && poetry run python -c 'import demo_project; print(demo_project.VALUE)')"
          echo "value: $VAL"
          [ "$VAL" = "demo-project-ok" ] || { echo "FAIL: unexpected value"; exit 1; }
          PYV="$(poetry run python -c 'import sys; print("%d.%d" % sys.version_info[:2])')"
          echo "python: $PYV"
          [ "$PYV" = "3.10" ] || { echo "FAIL: expected python 3.10"; exit 1; }
          echo "PASS"
